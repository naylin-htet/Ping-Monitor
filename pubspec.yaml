name: ping_monitor
description: Professional real-time network monitoring with live graphs, alerts, and background service.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.9

  # Charts
  fl_chart: ^0.66.2

  # Alerts
  audioplayers: ^5.2.1
  vibration: ^1.8.4
  flutter_tts: ^3.8.5

  # Permissions
  permission_handler: ^11.3.0

  # Background / Foreground service
  flutter_foreground_task: ^6.1.2

  # Storage
  shared_preferences: ^2.2.2

  # Connectivity
  connectivity_plus: ^5.0.2

  # Export / Share
  path_provider: ^2.1.2
  share_plus: ^7.2.2
  intl: ^0.19.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
